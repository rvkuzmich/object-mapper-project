spring:
  application:
    name: object-mapper-project

server:
  port: 8443
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: password
    key-store-type: PKCS12
    key-alias: tomcat

  datasource:
    url: jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

    h2:
      console:
        enabled: true
        path: /h2-console
        settings:
          trace: false
          web-allow-others: false

    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: create-drop
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          use_sql_comments: true

jwt:
  secret: "mySuperSecretKeyForJWTTokenGeneration2024With256BitsLength"
  expiration: 3600000
  refresh:
    expiration: 86400000

security:
  max:
    login:
      attempts: 5
  lock:
    time:
      minutes: 30

logging:
  level:
    ru:
      kuzmich:
        objectmapperproject: DEBUG
  file:
    name: logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"